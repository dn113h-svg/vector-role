---
- name: Install required packages
  ansible.builtin.dnf:
    name:
      - curl
      - ca-certificates
      - gnupg2
    state: present
    update_cache: true
  become: true

- name: Setup Vector repository
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://setup.vector.dev | bash
  args:
    executable: /bin/bash
    creates: /etc/yum.repos.d/vector.repo
  become: true

- name: Install Vector
  ansible.builtin.dnf:
    name: vector
    state: present
    update_cache: true
  become: true

- name: Render Vector config
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Validate Vector config