---
vector_version: "latest"

vector_config_path: "/etc/vector/vector.yaml"
vector_service_name: "vector"

vector_validate_config: true

vector_sources:
  demo_logs:
    type: demo_logs
    format: json
    interval: 1

vector_transforms: {}

vector_sinks:
  console:
    type: console
    inputs:
      - demo_logs
    encoding:
      codec: json